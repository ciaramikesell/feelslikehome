<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feels Like Home — Offline</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #FAF6EF; color: #2E2621; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 320px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 14px; color: #8A7C6E; line-height: 1.5; margin: 0; }
    button {
      margin-top: 20px; font-size: 14px; font-weight: 600; color: #fff; background: #C1592F;
      border: none; border-radius: 10px; padding: 10px 20px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Feels Like Home needs a connection to load your homes and search. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
